name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

# Read-only token: CI only checks out and builds.
permissions:
  contents: read

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on critical advisories. High is not used as the gate because
      # http-cache-semantics (GHSA-ch52-4w7c-c8xp) has no patched release yet and only
      # affects Astro's remote-image cache, which this site does not use.
      - name: Audit dependencies
        run: npm audit --audit-level=critical

      - name: Build Astro site
        run: npm run build
