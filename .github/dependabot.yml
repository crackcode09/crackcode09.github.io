# Weekly update PRs for npm packages and GitHub Actions, opened against dev
# (all changes reach main through a dev → main PR).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      # upload-pages-artifact v4+ drops every dot-folder from the artifact (no opt-out),
      # which would silently unpublish /.well-known/security.txt. Stay on v3 until handled.
      - dependency-name: actions/upload-pages-artifact
        update-types: ["version-update:semver-major"]
